[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-recall"
version = "0.1.0"
description = "Local-first, cross-platform search for Codex CLI session history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Recall contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
codex-recall = "codex_recall.cli:main"

[tool.setuptools.packages.find]
include = ["codex_recall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
